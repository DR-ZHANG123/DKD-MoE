# DKD-MoE — every tunable parameter. Stages read this file; nothing is hardcoded.
seed: 20260929
paths:
  raw: data/raw
  processed: data/processed

cohort:
  # GSE211785 disease labels used for the primary three-level contrast
  groups: [Control, HKD, DKD]
  # donors whose tissue also appears in the Zenodo 19868428 spatial atlas are
  # excluded from any analysis that is described as independent of discovery
  exclude_overlap_from_independent: true

pseudobulk:
  min_cells_per_sample: 20        # donor x tech x celltype cells required
  min_donors_per_group: 3
  min_counts_gene: 10             # gene kept if >= this many counts in >= min_samples_gene samples
  min_samples_gene: 3
  fdr: 0.05

# fine cell types of the GSE211785 annotation (Cluster_Idents) -> lineage used for screening
lineage_map:
  PT: [PT_S1, PT_S2, PT_S3, iPT]
  TAL: [M_TAL, C_TAL, Macula_Densa]
  ThinLimb: [Des-Thin_Limb, Ascending_Thin_LOH]
  DCT_CNT: [DCT1, DCT2, CNT]
  PC: [PC]
  IC: [IC_A, IC_B]
  Podo: [Podo]
  PEC: [PEC]
  Endo: [Endo_GC, Endo_Peritubular, Endo_Lymphatic]
  Stroma: [Fibroblast_1, Fibroblast_2, MyoFib/VSMC, GS_Stromal, Mes]
  Myeloid: [CD14_Mono, CD16_Mono, Mac, cDC, pDC, Neutrophil, Baso/Mast]
  Lymphoid: [CD4T, CD8T, NK, B_Naive, B_memory, Plasma_Cells, Prolif_Lym]
# injured / adaptive states whose within-lineage fraction is tested as composition
state_fractions:
  PT: iPT
  Stroma: Fibroblast_2

replication_qc:        # GSE195460 snRNA
  min_genes: 500
  max_genes: 6000
  max_pct_mt: 5

kpmp:
  clinical_table: OpenAccessClinicalData_20260803.csv
  descriptor_table: KPMP_TIV_Descriptor_Scores_02.19.2026.xlsx
  download_groups: [DKD, HKD, HKD_withDM, Reference, DM_noCKD]
  wsi_stains: ["H&E stain", "PAS stain"]
  parallel: 4

library_qc:
  sc_mt_split: 0.15        # scRNA protocol batches separate cleanly around this mt fraction
  sc_ribo_fail: 0.01       # scRNA library with nuclear-like profile -> excluded
  min_cells_library: 100

lodo:
  targets:
    lineage: [PT, TAL, DCT_CNT, Stroma, ThinLimb]
    fine: [iPT, C_TAL, CNT, Fibroblast_1]

scdisinfact:                 # author defaults (Nat Commun 2024 tutorial) unless stated
  focus_lineage: PT          # chosen on discovery-internal evidence (03, 03c)
  focus_celltypes: [iPT]     # within-state programme; iPT expansion itself is shared (03d)
  min_cells_library: 50
  min_cells_gene: 50
  n_hvg: 5000
  Ks: [8, 2]                 # common factor dim, condition factor dim
  batch_size: 64
  interval: 10
  lr: 5.0e-4
  nepochs: 100
  reg_mmd_comm: 1.0e-4
  reg_mmd_diff: 1.0e-4
  reg_gl: 1
  reg_class: 1
  reg_kl_comm: 1.0e-5
  reg_kl_diff: 1.0e-2
  seeds: [0, 1, 2, 3, 4]

lock:                       # marker-gene selection rules
  ckg_top_frac: 0.10
  dE_fdr: 0.10
  lodo_sign_stable: 0.80
  max_genes: 50
  min_genes: 10
  shared_dE_min_padj: 0.50
  # a-priori exclusions: sex-chromosome genes (sex is unbalanced across the
  # 3 DKD SN donors), immunoglobulin / haemoglobin / mitochondrial genes (ambient RNA), and
  # symbols that are not HGNC-approved (clone-based lncRNAs, poorly portable across platforms)
  exclude_regex: "^(IG[HKL][VDJC]|IGH[AGMDE]|JCHAIN|HB[ABDEGQMZ]\\d?$|MT-|MTRNR)"
  require_hgnc_approved: true

kpmp_qc:
  sn: {min_genes: 500, max_genes: 6000, max_pct_mt: 5}
  sc: {min_genes: 300, max_genes: 7000, max_pct_mt: 50}
  duplicate_barcode_overlap: 0.5

kpmp_concordance:
  min_posterior: 0.7

gsea:
  min_size: 15
  max_size: 500
  permutations: 2000

robustness:                 # 12a-12c (technical-axis, Zenodo gene-level spatial, KPMP clinical)
  n_cyto_markers: 200
  exclude_terms: [GOBP_RIBOSOME_BIOGENESIS, GOBP_CYTOPLASMIC_TRANSLATION, REACTOME_EUKARYOTIC_TRANSLATION_ELONGATION,
                  REACTOME_EUKARYOTIC_TRANSLATION_INITIATION, REACTOME_RRNA_PROCESSING]
  key_terms: [HALLMARK_MYC_TARGETS_V1, HALLMARK_MYC_TARGETS_V2, HALLMARK_EPITHELIAL_MESENCHYMAL_TRANSITION,
              HALLMARK_TNFA_SIGNALING_VIA_NFKB, HALLMARK_IL6_JAK_STAT3_SIGNALING, HALLMARK_INTERFERON_GAMMA_RESPONSE,
              HALLMARK_UNFOLDED_PROTEIN_RESPONSE, HALLMARK_ALLOGRAFT_REJECTION, HALLMARK_OXIDATIVE_PHOSPHORYLATION,
              HALLMARK_KRAS_SIGNALING_DN, REACTOME_SIGNALING_BY_BMP, GOBP_ANTERIOR_POSTERIOR_PATTERN_SPECIFICATION,
              GOBP_PATTERN_SPECIFICATION_PROCESS, GOBP_CYTOPLASMIC_TRANSLATION, REACTOME_EUKARYOTIC_TRANSLATION_ELONGATION]
  zenodo_genes: [IGFN1, CD44, NDRG1]
  zenodo_min_cells: 20
  clinical_min_n: 10

visium:                     # stages 10a/10b
  marker_min_cells: 20
  marker_min_log2cpm: 3
  n_markers: 30
  marker_min_t: 4
  min_genes: 5
  ipt_rich_top_frac: 0.20
  min_spots_participant: 50
  min_spots_section: 20
  deconv_markers: 50
  deconv_min_cp10k: 2
  pt_rich_min_share: 0.5
  pt_rich_top_frac: 0.20    # PT-rich spots = top 20% of a section by PT-lineage marker score

histology:                    # stage 11 (same-section H&E)
  encoder: owkin/phikon-v2    # ungated ViT-L pathology foundation model (HF), fixed
  encoder_revision: 2ae989a9c40cffaa27f0a6cb29cc94d1d6f9a5fd
  field_um: 112               # square field centred on the 55-um spot (spot + context)
  patch_px: 224               # resized input -> 0.5 um/px
  tissue_delta: 0.10          # RGB distance from the section's own background colour
  tissue_min_darker: 0.05     # tissue pixels are darker than background by at least this
  min_tissue_frac: 0.25       # patches with less tissue are not embedded
  hema_thr: 0.05              # rgb2hed haematoxylin OD threshold for nuclear pixels
  eosin_thr: 0.02
  nucleus_min_px: 12          # connected component area (at 0.5 um/px) counted as a nucleus
  ridge_alphas: [1, 10, 100, 1000, 10000]
  min_sections_prediction: 10
  min_orientation_auc: 0.9     # in-tissue vs off-tissue spot tissue-fraction AUC required to register a Loupe image

wsi:                          # stage 13 (KPMP whole-slide H&E / PAS, participant level)
  target_um_per_px: 0.5       # tiles read at level 0 and resized to this scale
  tile_px: 224                # -> 112 um field
  thumb_downsample: 32        # tissue mask resolution
  mask_sat_thr: 0.07          # HSV saturation threshold for tissue (after Otsu floor)
  min_tile_tissue: 0.5        # fraction of tile covered by tissue mask
  min_blur_var: 30            # Laplacian variance of the grey tile; lower = out of focus
  pen_hue_ranges: [[0.40, 0.72]]   # green/blue ink hue band (HSV hue 0-1) excluded when saturated
  pen_sat_thr: 0.35
  max_tiles: 2000             # per slide, uniform random sample (seeded) of QC-passing tiles
  tubule_lumen_range: [0.05, 0.40]  # tubule-rich subset: white_frac within range AND eosin_frac >= slide median
  min_tiles_slide: 100
  cv_folds: 10
  n_jobs: 48                  # parallel workers for permutation nulls
  # primary analysis reported in the main text; other stain/tileset/modality
  # combinations are sensitivity analyses in the supplementary table
  primary: {stain: HE, tileset: all, modality: sn, target: "DKDiPT_up | SharedInjury_up, IF%"}
  n_perm: 1000
  ridge_alphas: [1, 10, 100, 1000, 10000, 100000]
  poll_minutes: 15
  poll_max_hours: 3
  poll_target_frac: 0.8

albuminuria_models:           # stage 14b (albuminuria / proteinuria covariate-adjusted and marker-vs-injury models)
  outcomes: [albuminuria, proteinuria]
  covariates: {egfr: egfr_band, fibrosis: if_pct, raas: raas}   # bands/percentages entered as percentile ranks; raas 0/1
  scopes: {all: [DKD, HKD, HKD_withDM], DKD_only: [DKD], no_HKD_withDM: [DKD, HKD]}
  n_boot: 2000                # participant resamples, stratified by diagnosis
  min_n: 10

permutation_concordance:      # stage 14a: calibrated nulls for the KPMP transcriptome concordance
  n_perm: 1000                # participant-label permutations (within modality, group sizes kept)
  n_background: 1000          # baseMean-decile-matched random gene sets
  basemean_bins: 10
  pseudocount: 1.0            # mean-ratio sensitivity statistic only (primary = fixed-dispersion NB GLM)
  min_sign_agreement: 0.95    # fast vs DESeq2 log2FC sign agreement required on observed labels
  egfr_strata_edges: [30, 40, 50, 60]   # eGFR-adjusted contrast: labels permuted within these bands
  n_deseq_check: 20           # permutations refitted with full DESeq2 to check the fast null

contamination_controls:       # stage 14d: leukocyte / ambient-RNA controls for the DKD-vs-HKD iPT shift
  # canonical leukocyte genes (index = fraction of iPT pseudobulk counts). CD74 / HLA-DRA are also
  # inducible in injured tubular epithelium, so a strict list without MHC-II is reported alongside.
  leukocyte_genes: [PTPRC, CD74, HLA-DRA, LYZ, CD3E, CD2, MS4A1, CD52, CORO1A, LCP1, TYROBP, FCER1G, C1QA, NKG7]
  leukocyte_strict: [PTPRC, CD3E, CD2, MS4A1, LYZ, CD52, CORO1A, LCP1, TYROBP, NKG7]
  stroma_strict: [DCN, LUM, COL1A2, COL3A1, PDGFRB, C7]
  # immunoglobulin transcripts are kept out of the leukocyte index (plasma-cell ambient; already excluded
  # a priori from the programmes) and reported as their own index
  ig_genes: [IGKC, IGHG1, IGHA1, IGLC2, JCHAIN]
  immune_lineages: [Myeloid, Lymphoid]      # compartments built from lineage_map
  stroma_lineages: [Stroma]
  healthy_pt: [PT_S1, PT_S2, PT_S3]
  min_cells_compartment: 20                 # participant-level non-PT profile required for the correlation index
  nonpt_marker_ratio: 4                     # non-PT marker gene: pooled immune+stroma CPM >= ratio x pooled PT CPM
  nonpt_marker_min_cpm: 10
  specificity_ratio: 1.0                    # concordance drops genes whose immune or stromal CPM > ratio x iPT CPM
  specificity_ratio_strict: 0.5
  synapse_term_regex: "SYNAP"               # GO BP terms whose genes are flagged neuronal/synaptic-type
  # gene length: no verified local annotation (no GTF under data/raw) -> not assessed

pathways_by_cohort:           # stage 14e: preranked GSEA per cohort (DKD vs HKD iPT Wald statistics)
  consistency_fdr: 0.25       # a pathway is "consistent" if NES has the same sign and FDR < this in both cohorts
  full_gene_libraries: [hallmark, reactome]   # ranking without technical-gene exclusion (translation terms testable)
  key_terms: [HALLMARK_TNFA_SIGNALING_VIA_NFKB, HALLMARK_IL6_JAK_STAT3_SIGNALING, HALLMARK_EPITHELIAL_MESENCHYMAL_TRANSITION,
              REACTOME_SIGNALING_BY_BMP, GOBP_PATTERN_SPECIFICATION_PROCESS, GOBP_ANTERIOR_POSTERIOR_PATTERN_SPECIFICATION,
              HALLMARK_OXIDATIVE_PHOSPHORYLATION, REACTOME_TRANSLATION, REACTOME_EUKARYOTIC_TRANSLATION_ELONGATION,
              HALLMARK_MYC_TARGETS_V1, HALLMARK_INTERFERON_GAMMA_RESPONSE, HALLMARK_ALLOGRAFT_REJECTION]

published_pt_states:          # stage 14c: published PT injury-state signatures vs the DKD-associated iPT shift
  raw_dir: data/raw/published_signatures      # fetched by scripts/stages/00c_download_published_signatures.sh
  padj: 0.05                  # table-derived signatures: source-reported adjusted p below this, positive fold change
  max_genes: 200              # table-derived signatures with a per-gene fold change: top-N by the source's fold change
  kirita_frptc_cluster: 8     # Dataset S2 cluster carrying the three FR-PTC genes named in the Results (Vcam1, Dcdc2a, Sema5a)
  conditioning: [Kirita2020_FRPTC_DS2, Lake2023_aPT_snCv3, Lake2023_aPT_scCv3, Muto2021_PTVCAM1_vs_PT]   # joint model uses all four
  dE_fdr: 0.10                # discovery dE gene set (as in the lock rule)

test_summary:
  n_boot: 2000

site_sensitivity:
  n_perm: 1000

exposure_trend:
  n_perm: 10000

injury_intensity:
  signature: Abedini2024_iPT_ST8
  n_perm: 10000
marker_links:                 # stage 16: per-DKD-donor leave-out, modality overlap, marker score vs inflammatory pathways
  pathways: [HALLMARK_IL6_JAK_STAT3_SIGNALING, HALLMARK_TNFA_SIGNALING_VIA_NFKB, HALLMARK_INTERFERON_GAMMA_RESPONSE,
             HALLMARK_INFLAMMATORY_RESPONSE]
  gmt: data/raw/reference/h.all.v2024.1.Hs.symbols.gmt
  n_boot: 2000
