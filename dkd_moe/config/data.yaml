# dkd_moe data module: every tunable for fetching and preparing extra KPMP open-access data
seed: 20261010
kpmp_doi: 10.48698/16dd-vj20          # KPMP atlas repository DOI (primary dataset DOI in the file table)
file_table: data/raw/kpmp/kpmp_repository_all_files.tsv
clinical_table: data/raw/kpmp/OpenAccessClinicalData_20260803.csv
raw_dir: /path/to/dkd_moe_data/raw/kpmp_dkd_moe
processed_dir: /path/to/dkd_moe_data/processed/dkd_moe
existing_raw: data/raw/kpmp                       # files already fetched by the main pipeline are reused, not re-downloaded
existing_visium: data/processed/kpmp_visium
size_cap_tb: 3.0                                  # categories above this are restricted to core_groups
core_groups: [DKD, HKD, HKD_withDM, Reference, DM_noCKD]
download:
  workers: 6
  tries: 10
  waitretry: 20
  attempts: 5           # outer retries of a whole file (server sometimes refuses at once)
annotation_files:                                 # newest KPMP clustered atlases (same DOI as the repository)
  sc: KPMP_PREMIERE_SC_version2_ForExplorer_RemovedBatchEffect_Final2025.h5seurat
  sn: SingleNucleus_KPMP_Explorer_05182025.h5Seurat
multiome:
  min_genes: 500          # RNA genes per nucleus (same as the main pipeline's KPMP snRNA QC)
  max_genes: 6000
  max_pct_mt: 5.0
  min_frag: 1000          # ATAC unique fragments per nucleus
  max_frag: 100000
  min_tss_enrichment: 2.0
  max_nucleosome_signal: 4.0
  min_cells_library: 100  # libraries with fewer passing nuclei are excluded
  duplicate_barcode_overlap: 0.5   # two archives of one participant sharing more barcodes = same library processed twice
  consensus_min_libraries: 2       # merged peak kept if called in >= this many libraries
  peak_width: 901                  # fixed consensus peak width (~ median CellRanger-ARC peak width)
  chrom_keep_regex: '^chr([0-9]+|X|Y)$'
  tss_window: 50          # +/- bp around TSS for the TSS signal
  tss_flank: [1900, 2000] # flank distance band used as background
  gene_upstream: 2000     # gene activity = protein-coding gene body + 2 kb upstream (Signac GeneActivity)
  chunk_rows: 5000000
  n_jobs: 24
  gtf_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_32/gencode.v32.primary_assembly.annotation.gtf.gz
  gtf_md5: f660ce967d954fe704700ddc81ebf373   # GENCODE v32 = annotation of the cellranger-arc GRCh38-2020-A reference
external_visium:
  min_region_spots: 50      # GSE339455 patient region with fewer in-tissue spots is marked unusable
