# expr module: interpretable mixture-of-experts model of proximal tubule cells (KPMP training only)
seed: 20261010
n_folds: 5

paths:
  kpmp_sc: data/processed/KPMP_sc_qc_counts.h5ad
  kpmp_sn: data/processed/KPMP_sn_qc_counts.h5ad
  visium_samples: results/10b_visium_kpmp/sample_table.tsv
  kpmp_files: data/raw/kpmp/kpmp_repository_all_files.tsv
  gse211785: data/processed/GSE211785_rna_counts.h5ad
  gse211785_library_qc: results/02c_library_qc/library_qc.tsv
  gse195460: data/processed/GSE195460_qc_counts.h5ad
  gse195460_labels: results/06_validate_gse195460/cell_labels.tsv.gz
  marker_sets: results/05_lock_programme/gene_sets.tsv
  hallmark_gmt: data/raw/reference/h.all.v2024.1.Hs.symbols.gmt
  splits: dkd_moe/config/splits.tsv
  bulk_dir: /path/to/dkd_moe_data/processed/dkd_moe
  ckpt_dir: /path/to/dkd_moe_data/dkd_moe_ckpt/expr

labels:
  # preferred first; the first existing source is used and recorded in expr_prep/label_source.json
  sources:
    # KPMP's own atlas annotation, extended inside KPMP to unannotated cells (scripts/expr/kpmp_labels.py)
    - name: kpmp_own_annotation_extended
      sc: dkd_moe/results/expr_labels/kpmp_cell_labels_sc.tsv.gz
      sn: dkd_moe/results/expr_labels/kpmp_cell_labels_sn.tsv.gz
    - name: label_transfer_gse211785_reference
      sc: results/07b_validate_kpmp/cell_labels_sc.tsv.gz
      sn: results/07b_validate_kpmp/cell_labels_sn.tsv.gz
  label_column: label
  healthy_pt: [PT_S1, PT_S2, PT_S3]
  injured_pt: [iPT]
  # alternative label vocabularies (KPMP atlas names) mapped onto the two PT states
  # KPMP atlas names: healthy = PT-S1/S2/S3; injured = adaptive (aPT) and failed-repair (frPT) PT, the
  # states that correspond to the injured PT (iPT) of the GSE211785 reference labels; degenerative (dPT) and cycling
  # (cycPT) PT are left out of both states
  healthy_pt_alias: [PT-S1, PT-S2, PT-S3, PT-S1/S2, PT-S2/S3]   # sc atlas uses merged segment names
  injured_pt_alias: [aPT, frPT]
  min_max_prob: 0.0          # optional label-confidence filter (0 = keep all)

prep:
  n_hvg: 3000
  hvg_flavor: seurat_v3        # on raw counts, batch_key = library-technology within KPMP training data
  min_cells_per_participant: 20
  # gene exclusion consistent with the main pipeline's a-priori technical gene exclusion
  exclude_regex: "^(MT-|RPL|RPS|MRPL|MRPS|HB[ABDEGMQZ]\\d?$|IG[HKL][VDJC]|XIST$|TSIX$|RPS4Y|DDX3Y|UTY$|KDM5D$|EIF1AY$|USP9Y$|ZFY$|NLGN4Y$|TXLNGY$)"
  hvg_sample_cells: 400000     # cells sampled (stratified by participant) for HVG selection

condition:
  # condition head (attached to routing probabilities only) contrasts DKD with HKD. Both are adjudicated
  # biopsies from KPMP recruitment sites. Reference tissue in KPMP comes only from other procurement routes
  # (tissue interrogation / opportunity-pool / pilot sites), so supervising Reference teaches the router a
  # procurement axis: with Reference supervised, one expert was dedicated to Reference
  # tissue (>0.9 of Reference cells, <0.06 of any recruitment-site group) and external nephrectomy-derived
  # cohorts were routed to it (0.6-0.9 of cells) irrespective of disease. Reference, HKD_withDM and
  # DM_noCKD therefore remain unsupervised (reconstruction only); HKD_withDM / DM_noCKD serve as an
  # in-distribution check of a diabetic-exposure gradient.
  map: {HKD: HKD, DKD: DKD}
  classes: [HKD, DKD]

model:
  n_hidden: 256
  n_backbone_layers: 2
  expert_hidden: 128
  n_latent: 16
  top_k: 2
  gate_temperature: 1.0
  dropout: 0.1

train:
  device: cuda:2
  batch_size: 1024
  lr: 1.0e-3
  weight_decay: 1.0e-5
  epochs: 30
  kl_warmup_epochs: 5
  w_kl: 1.0
  # weights relative to the NB reconstruction term (summed over 3,000 genes, ~850 per cell).
  # w_balance / w_adv fixed from a KPMP fold-0 comparison (balance {10,50} x adversary {5,20} at K=6):
  # 0.05/0.2 collapsed routing onto technology.
  w_balance: 10.0
  w_cond: 10.0
  w_adv: 5.0
  grl_lambda: 1.0
  cells_per_participant_cap: 3000   # cap per participant per epoch so large donors do not dominate
  num_workers: 0

cv:
  K_grid: [4, 6, 8]
  w_cond_grid: [2.0, 10.0]
  seeds_for_stability: [1, 2]
  epochs: 20
  # selection rule: rank each (K, w_cond) on three criteria computed on held-out
  # participants -- mean held-out NB NLL per count (lower better), routing stability between seeds
  # (adjusted Rand index of top-1 expert on held-out cells, higher better), and participant-level DKD vs
  # HKD separation (AUC of the condition head among injured-PT cells, higher better); pick the lowest
  # rank sum, ties broken by smaller K.
  # Eligibility: a configuration must route cells specifically -- at least 60% of held-out cells
  # with top-1 routing probability > 0.5 and mean per-cell routing entropy <= 0.6 log K.
  min_frac_top1_gt_half: 0.6
  max_entropy_over_logK: 0.6
  min_injured_cells: 20

final:
  K: null            # filled from CV selection (selection written to results/expr_cv/selection.json)
  seeds: [1, 2, 3, 4, 5]

interpret:
  ig_steps: 50
  ig_cells_per_expert: 2000
  top_n_genes: 100
  pathways: [HALLMARK_IL6_JAK_STAT3_SIGNALING, HALLMARK_TNFA_SIGNALING_VIA_NFKB,
             HALLMARK_INFLAMMATORY_RESPONSE, HALLMARK_INTERFERON_GAMMA_RESPONSE]

# ---------------------------------------------------------------------------------------------------
# Participant readout, stabilised training, meta-experts, consensus signature, external tests
readout_stability:
  readout:
    # primary participant score: condition-head DKD-vs-HKD log-odds per cell (linear in routing
    # probabilities), averaged over the participant's injured-PT cells, then over seeds
    cells: injured_PT
    seed_agreement: [icc_2_1, mean_pairwise_spearman]
  stability:
    # (a) warm start: K=1 model (backbone + decoder, no routing / condition terms) per training set,
    #     MoE seeds initialised from it (backbone, decoder, latent heads; each expert copied from the
    #     single expert with small noise); (b) gate noise annealed linearly to 0; deterministic gates at
    #     evaluation (already the case). Same K / weights as selected (K=6, w_cond=10).
    warm_epochs: 20
    moe_epochs: 20
    expert_init_noise: 0.02
    anneal_gate_noise: true
    cv_seeds: [1, 2, 3, 4, 5]
    # initialization rule (KPMP-internal only): shared-start training is used for the final model if seed ARI
    # and matched-expert correlation both improve and held-out DKD-vs-HKD AUC drops by < 0.02
    max_auc_drop: 0.02
    prefix: cvw
  meta_experts:
    # seed x expert units clustered by the mean of (i) correlation of IG gene profiles and (ii) correlation
    # of decoded mean profiles centred on the across-unit mean; average linkage, cut at r = 0.5;
    # interpretation restricted to meta-experts present in >= 4 of 5 seeds
    cut_r: 0.5
    min_seeds: 4
    decode_cells: 5000
  signature:
    # consensus IG of the DKD-vs-HKD log-odds over KPMP injured-PT cells (baseline = mean healthy PT),
    # per-seed attributions z-scored then averaged over seeds; fixed size before any scoring
    n_up: 50
    n_down: 50
    ig_cells: 4000
    score: mean_z_up_minus_mean_z_down     # z across samples within cohort x platform / technology
    min_genes_per_direction: 5             # below this a cohort is reported but not scored
  external:
    ercb_platforms: {GPL24120: [[DKD, HTN], [DKD, LD]], GPL22945: [[DKD, LD]]}
    ercb_primary: [GPL24120, DKD, HTN]
    zenodo_h5: data/raw/zenodo_dkd_spatial/spatial_adata_xenium_cosmx_zenodo.h5ad
    zenodo_celltypes: [iPT]                # injured PT, matching the KPMP readout; PT reported as secondary
    zenodo_contrasts: [[DKD, Control], [DKD, other_CKD]]
    sc_pseudobulk_cells: injured_PT
    meta_analysis: DerSimonian-Laird random effects on Hedges g; DKD vs disease control and DKD vs
      healthy control summarised separately, each cohort shown
    # one estimate per independent sample set in the meta-analysis: GSE211785 pooled over technologies;
    # Zenodo CosMx iPT only (4 donors are on both CosMx and Xenium; Xenium shown, not pooled)
    meta_zenodo_platform: CosMx
  pathways:
    libraries: [h.all.v2024.1.Hs.symbols.gmt, c2.cp.reactome.v2024.1.Hs.symbols.gmt]
    extra_sets_from_gobp: [GOBP_RESPONSE_TO_GLUCOCORTICOID, GOBP_CELLULAR_RESPONSE_TO_GLUCOCORTICOID_STIMULUS]
    method: preranked GSEA (gseapy prerank, 1000 permutations) on the consensus IG ranking of the 3,000 HVGs
    min_size: 10
    max_size: 500
  clinical:
    populations: [all, CKD, DKD]
    covariates: [[injured_fraction], [injured_fraction, egfr_band_ord]]

# ---------------------------------------------------------------------------------------------------
# Transfer signature (selection uses KPMP-internal evidence only)
transfer:
  pseudobulk: {cells: injured_PT, min_cells: 20, min_cpm: 1, min_frac_expressed: 0.5}
  # z-scoring for KPMP signature scores: across all KPMP participants of the same technology (label-free),
  # participant score = mean over technologies; externals scored exactly as in readout_stability.signature
  constructions:
    readout_assoc: training-fold participants; Spearman(readout, injured-PT pseudobulk log2 CPM) within sc and
      within sn, combined by Fisher z weighted by n - 3; readout = training-fold models (5 seeds) on their own
      training participants; top 50 positive / 50 negative
    ig_hkd_baseline: IG of the DKD-vs-HKD log-odds on training-fold injured-PT cells with baseline = mean
      injured-PT profile of HKD training participants; fold models, 5 seeds, z per seed then mean; 50 / 50
    ig_healthy_baseline: as the consensus signature (baseline = mean healthy-PT profile) but cross-fitted with fold models; 50 / 50
  ig_cells_per_fold: 2000
  n_up: 50
  n_down: 50
  # selection: highest pooled cross-fitted KPMP DKD-vs-HKD AUC (participant level, out-of-fold scores);
  # the chosen construction is rebuilt once on all KPMP (final models) and scored in the external cohorts
  selection_metric: auc_dkd_hkd_pooled
  readout_meta: {cohorts: [[gse211785, pooled, DKD_vs_HKD], [gse195460, pooled, DKD_vs_Control]], sign_test: binomial}
  confounding: readout ~ DKD + tech + injured_fraction + log(n_cells) [+ recruitment site from participant-ID
    prefix, + tissue_source if it varies within DKD/HKD]; participant x technology level, KPMP held-out readout;
    plus the DKD x tech interaction

# ---------------------------------------------------------------------------------------------------
# Participant-level adjustment, clinical incremental value, external summaries by control type,
# nested check of the K / condition-weight selection (all from existing held-out predictions; no retraining)
patient_level_models:
  adjusted:
    # one pooled held-out readout per participant (DKD and HKD); sites with fewer participants pooled as 'other'
    min_site_participants: 3
    covariates: [injured_fraction, log_n_cells, site, tech_set]   # tech_set = sc only / sn only / both
  clinical:
    groups: [DKD, HKD, HKD_withDM]          # CKD diagnosis groups present in KPMP (reference level DKD)
    covariate_sets: [[injured_fraction], [injured_fraction, egfr_band_ord]]
  external_meta:
    disease_control: [[gse211785, pooled, DKD_vs_HKD]]
    healthy_control: [[gse211785, pooled, DKD_vs_Control], [gse195460, pooled, DKD_vs_Control]]
  nested_selection:
    prefix: cv          # the grid runs used for the original selection (expr_cv)

# ---------------------------------------------------------------------------------------------------
# Full nested cross-validation of the K / condition-weight selection and the final procedure.
# Outer loop = the 5 participant folds of splits.tsv. Inside each outer training set, every grid setting
# (cv: K_grid x w_cond_grid, cv: seeds_for_stability, cv: epochs) is trained on 3 of the 4 remaining folds and
# scored on the fourth (inner 4-fold CV); the cv: eligibility and rank-sum rule picks one setting per outer fold.
nested_cv:
  inner_prefix: ncv_inner      # <ckpt_dir>/<inner_prefix>/ncvi_o{o}_K{K}_wc{w}_s{s}_i{i}.npz
  outer_prefix: ncv_outer      # <ckpt_dir>/<outer_prefix>/ncvo_K{K}_wc{w}_s{s}_f{o}.npz
  bootstrap_reps: 4000         # participant bootstrap, stratified by outer fold x diagnosis
  ci: 0.95

# ---------------------------------------------------------------------------------------------------
# Supervision variants (scripts/expr/sup_variants.py). Same architecture, K, condition weight, shared start
# (cvw single-expert models), schedule, partitions and seeds as the final procedure; only the condition term
# differs:
#   injured   cell-level condition loss restricted to injured-PT cells of DKD / HKD participants
#   patient   participant-level loss: each step draws bags of injured-PT cells from training DKD and HKD
#             participants (balanced by diagnosis), averages routing probabilities within each bag and applies
#             the condition classifier to the bag mean (the participant readout of Eq. 12 is the same linear map
#             of mean routing); the cell-level condition term is switched off
supervision_variants:
  variants: [injured, patient]
  patient:
    participants_per_step: 16      # 8 DKD + 8 HKD bags per optimisation step
    cells_per_bag: 64              # injured-PT cells per bag (sampled without replacement when available)
    min_injured_cells: 20          # participants with fewer injured-PT cells in the training set are not bagged
  cv_prefix: {injured: cvinj, patient: cvpat}
  final_prefix: {injured: finalinj, patient: finalpat}

# ---------------------------------------------------------------------------------------------------
# Diabetes / CKD groups and extended clinical models (scripts/expr/diabetes_groups.py, clinical_models.py)
groups_clinical:
  groups_same_procurement: [DKD, HKD_withDM, HKD, DM_noCKD]   # all from KPMP recruitment sites
  group_comparisons: [[DKD, HKD], [HKD_withDM, HKD], [DKD, HKD_withDM], [DM_noCKD, HKD], [DKD, DM_noCKD],
                      [DM_noCKD, Reference], [HKD, Reference]]
  group_covariates: [injured_fraction, log_n_cells, age_ord, male, C(tech_set), C(site_c)]
  egfr_covariate: egfr_ord
  min_site_participants: 3
  clinical:
    population: [DKD, HKD, HKD_withDM]
    outcomes: [albuminuria_band, proteinuria_band, egfr_band]
    covariate_sets:
      base: [injured_fraction]
      diagnosis: [injured_fraction, group]
      diagnosis_egfr: [injured_fraction, group, egfr_ord]
      full: [injured_fraction, group, egfr_ord, age_ord, male, tech_set, site_c]
    n_boot: 2000
    cv_folds: 5
    cv_repeats: 50
    n_jobs: 48
    resampled_readouts: [moe, no_experts, M3, M1, M3_train_only, nonmoe_Lpos, nonmoe_Lneg]   # bootstrap and cross-validated value only for these
    paired_gain_boot: 500         # participant bootstrap of the paired cross-validated gain (repeats per resample below)
    paired_gain_repeats: 10
    paired_pairs: [[M3, no_experts], [M3, moe], [M3_train_only, no_experts], [M3_train_only, nonmoe_Lpos], [M3_train_only, nonmoe_Lneg]]
# Cell annotation, cell quality, technology agreement and non-PT RNA checks (scripts/expr/readout_robustness.py)
robustness:
  min_cells_subset: 10          # injured-PT cells per participant x technology in annotation / quality subsets
  marker_sets:
    immune: [PTPRC, CD74, LYZ, C1QA]
    stromal: [COL1A1, COL1A2, COL3A1, DCN, LUM, PDGFRB, ACTA2]
    endothelial: [EMCN, VWF]
  source_celltypes:             # KPMP labels compared with injured PT for each signature gene
    injured_PT: [aPT, frPT]
    fibroblast_stromal: [FIB, VSMC/P]
    immune: [Lymphoid, Myeloid]
    endothelial: [EC]
  full_counts: {sc: data/processed/KPMP_sc_qc_counts.h5ad, sn: data/processed/KPMP_sn_qc_counts.h5ad}
# Signature restricted to genes expressed mainly by proximal tubule cells (scripts/expr/pt_signature.py).
# Gene source: mean CP10k in injured PT relative to the highest of fibroblast / stromal, immune and endothelial
# cells of the same KPMP samples (robustness.source_celltypes), required in both technologies; and readout-gene
# correlation adjusted for injured-PT expression of the non-PT marker sets (robustness.marker_sets).
pt_signature:
  min_pt_ratio: 0.5             # injured-PT mean >= this fraction of the highest non-PT compartment, sc and sn
  constructions: [pt_intrinsic, marker_adjusted, pt_intrinsic_marker_adjusted]
# DKD versus diabetes without CKD after matching on injury extent, kidney function and age (diabetes_groups.py)
severity_matching:
  covariates: [injured_fraction, egfr_ord, age_ord]
  ratio: 2                      # DKD participants per participant with diabetes without CKD, without replacement
  readouts: [moe, no_experts, M1, M3, M3_train_only]
